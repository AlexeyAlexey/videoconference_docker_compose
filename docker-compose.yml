# Docker Compose for the three-app video conference stack.
#
#   frontend  : nginx serving the built video_conference_vite (Vite + native JS) SPA
#   backend   : video_conference (Elixir/Phoenix)  — API + websocket, signs JWTs
#               http3_server   (Elixir/wtransport) — WebTransport/HTTP3 media server
#
# Browser flow:
#   1. http://localhost:8443            -> nginx (frontend SPA)
#   2. https://localhost:443  (+ wss)      -> video_conference (API + Phoenix socket)
#   3. https://localhost:4433 (WebTransport) -> http3_server (media), using the
#      self-signed cert hash (HTTP3_SERVER_CERT_HASH) to pin the certificate.
#
# The self-signed cert + JWT keypair live in ./certs (see README). The PEM keys
# are inlined below as YAML block scalars so they reach the Elixir runtime with
# REAL newlines (Joken requires real newlines, not literal "\n").

name: videoconference

services:
  frontend:
    build:
      context: https://github.com/AlexeyAlexey/video_conference_vite.git
      # context: https://github.com/AlexeyAlexey/video_conference_vite.git#feature/unification
      # context: https://github.com/AlexeyAlexey/video_conference_vite.git#branch-name - exxample when you want to get branch
      # context: ./video_conference_vite # if you cloned this app into this directory
      args:
        # Origin of the SPA itself (used to build shared-link URLs).
        VITE_SCHEMA: "${FRONTEND_APP_VITE_SCHEMA}"
        VITE_HOST: "${FRONTEND_APP_VITE_HOST}"
        VITE_PORT: "${FRONTEND_APP_VITE_PORT}"
        # Phoenix (video_conference) endpoints the browser talks to. They point
        # at THIS origin (localhost:8443); nginx reverse-proxies the API and
        # websocket paths to the backend, so the browser only trusts one cert.
        VITE_MANAGER_WEBSOCKET_SERVER_PROTOCOL: "${FRONTEND_APP_VITE_MANAGER_WEBSOCKET_SERVER_PROTOCOL}"
        VITE_MANAGER_HTTP_SERVER_PROTOCOL: "${FRONTEND_APP_VITE_MANAGER_HTTP_SERVER_PROTOCOL}"
        VITE_MANAGER_SERVER_HOST: "${FRONTEND_APP_VITE_MANAGER_SERVER_HOST}"
        VITE_MANAGER_SERVER_PORT: "${FRONTEND_APP_VITE_MANAGER_SERVER_PORT}"
        VITE_MANAGER_HTTP_SERVER_PORT: "${FRONTEND_APP_VITE_MANAGER_HTTP_SERVER_PORT}"
    image: videoconference/frontend:latest
    container_name: vc_frontend
    ports:
      # - "8080:8080"
      - "8443:8443"
    volumes:
      - ./certs/frontend.crt:/certs/frontend.crt:ro
      - ./certs/frontend.key:/certs/frontend.key:ro
    depends_on:
      - video_conference
    restart: unless-stopped

  video_conference:
    build:
      context: https://github.com/AlexeyAlexey/video_conference.git
      # context: https://github.com/AlexeyAlexey/video_conference.git#feature/unification
      # context: ./video_conference
    image: videoconference/video_conference:latest
    container_name: vc_backend
    ports:
      # - "80:80"     # http listener (browser API + websocket)
      - "443:443"   # https listener
    environment:
      MIX_ENV: "${VIDEO_CONFERENCE_APP_MIX_ENV}"
      PHX_HOST: "${VIDEO_CONFERENCE_APP_PHX_HOST}"
      PORT: "${VIDEO_CONFERENCE_APP_PORT}"
      SSL_KEY_PATH: /app/certs/server.key
      SSL_CERT_PATH: /app/certs/server.crt
      # http3_server is reached by the BROWSER, so use the host-reachable name.
      HTTP3_SERVER_HOST: "${VIDEO_CONFERENCE_APP_HTTP3_SERVER_HOST}"
      HTTP3_SERVER_PORT: "${VIDEO_CONFERENCE_APP_HTTP3_SERVER_PORT}"
      # SHA-256 of the self-signed cert (DER). The cert MUST be <= 12 days valid
      # for the browser to accept `serverCertificateHashes` pinning (W3C WebTransport).
      # Value comes from .env (set by scripts/gen_media_cert.sh).
      HTTP3_SERVER_CERT_HASH: "${VIDEO_CONFERENCE_APP_HTTP3_SERVER_CERT_HASH}"
      DATABASE_PATH: /app/data/prod.db
      JWT_SECRET: "${VIDEO_CONFERENCE_APP_JWT_SECRET}"
      SECRET_KEY_BASE: "${VIDEO_CONFERENCE_APP_SECRET_KEY_BASE}"
    volumes:
      - ./certs:/app/certs:ro
      - ./data:/app/data
    # Run migrations, then start the server. The JWT private key is read from
    # certs/ (generated by scripts/gen_jwt_keys.sh) and exported into the env at
    # container start, because the app expects the PEM content (not a file path).
    command: |
      sh -c 'export TELEPHONE_SWITCHBOARD_PRIVET_KEY="$(cat /app/certs/telephone_switchboard_private_key.pem)"; /app/bin/migrate && /app/bin/server'
    restart: unless-stopped

  http3_server:
    build:
      context: https://github.com/AlexeyAlexey/http3_server.git
      # context: https://github.com/AlexeyAlexey/http3_server.git#feature/unification
      # context: ./http3_server
    image: videoconference/http3_server:latest
    container_name: vc_http3
    ports:
      - "4433:4433/tcp"
      - "4433:4433/udp"
    environment:
      MIX_ENV: "${HTTP3_SERVER_APP_MIX_ENV}"
      # Bind all interfaces so the published port is reachable from the host.
      HOST: "${HTTP3_SERVER_APP_HOST}"
      PORT: "${HTTP3_SERVER_APP_PORT}"
      SSL_KEY_PATH: /app/certs/server.key
      SSL_CERT_PATH: /app/certs/server.crt
    volumes:
      - ./certs:/app/certs:ro
    # Start the server. The JWT public key is read from certs/ (generated by
    # scripts/gen_jwt_keys.sh) and exported into the env at container start,
    # because the app expects the PEM content (not a file path).
    command: |
      sh -c 'export JWT_LOCAL_HOST_PUBLIC_KEY="$(cat /app/certs/jwt_local_host_public_key.pem)"; exec bin/http3_server start'
    restart: unless-stopped
